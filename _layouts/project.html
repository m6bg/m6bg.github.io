---
layout: default
---
<article class="project">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to projects</a>

  <header class="project-header">
    <h1>{{ page.title }}</h1>
    <p class="project-subtitle">{{ page.subtitle }}</p>
    <p class="project-date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %Y' }}</time>
    </p>
    {% if page.stack.size > 0 %}
      <ul class="stack-list" aria-label="Tools and technologies">
        {% for item in page.stack %}
          <li>{{ item }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="project-body">
    {{ content }}
  </div>
</article>

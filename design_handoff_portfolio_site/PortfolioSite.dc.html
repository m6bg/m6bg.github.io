<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Portfolio Site" description="Minimal light-green personal site: landing, vertical project list, project detail" -->
<helmet><script src="./ds-base.js"></script></helmet>
<sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
<div style="min-height:100vh;background:var(--surface-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;font-family:var(--font-sans)">
<div style="font-size:clamp(2.75rem,6vw,5.5rem);font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)">Mark Pasacreta</div>
<nav style="display:flex;gap:56px">
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.ForwardLink" onClick="{{ goExperience }}" hint-size="80px,32px">experience</x-import>
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.ForwardLink" onClick="{{ goPortfolio }}" hint-size="80px,32px">portfolio</x-import>
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.ForwardLink" onClick="{{ goHobbies }}" hint-size="70px,32px">hobbies</x-import>
</nav>
</div>
</sc-if>
<sc-if value="{{ isPortfolio }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;background:var(--surface-bg);font-family:var(--font-sans)">
<div style="padding:32px 48px"><x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.BackMark" onClick="{{ goLanding }}" hint-size="20px,24px"></x-import></div>
<div style="max-width:560px;margin:0 auto;padding:40px 24px 120px;display:flex;flex-direction:column;gap:22px">
<sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.ProjectLink" onMouseEnter="{{ p.select }}" hint-size="100%,32px">{{ p.title }}</x-import>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;background:var(--surface-bg);font-family:var(--font-sans)">
<div style="padding:32px 48px"><x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.BackMark" onClick="{{ goPortfolio }}" hint-size="20px,24px"></x-import></div>
<div style="max-width:640px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:36px">
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.SectionHeader" title="{{ current.title }}" dates="{{ current.dates }}" hint-size="100%,80px"></x-import>
<x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.WritingBlock" hint-size="100%,160px">{{ current.body }}</x-import>
</div>
</div>
</sc-if>
<sc-if value="{{ isExperience }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;background:var(--surface-bg);font-family:var(--font-sans)">
<div style="padding:32px 48px"><x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.BackMark" onClick="{{ goLanding }}" hint-size="20px,24px"></x-import></div>
<div style="max-width:560px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:40px">
<div style="font-size:var(--text-h1);font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)">experience</div>
<sc-for list="{{ experience }}" as="e" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;gap:16px;align-items:baseline">
<div style="font-size:var(--text-h2);font-weight:600;color:var(--text-primary)">{{ e.role }}</div>
<div style="font-size:var(--text-small);color:var(--text-secondary);white-space:nowrap">{{ e.dates }}</div>
</div>
<div style="font-size:var(--text-body);color:var(--text-secondary)">{{ e.org }}</div>
<div style="font-size:var(--text-body);line-height:var(--leading-normal);color:var(--text-primary)">{{ e.description }}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isHobbies }}" hint-placeholder-val="{{ false }}">
<div style="min-height:100vh;background:var(--surface-bg);font-family:var(--font-sans)">
<div style="padding:32px 48px"><x-import component-from-global-scope="MarkPasacretaDesignSystem_dc2f65.BackMark" onClick="{{ goLanding }}" hint-size="20px,24px"></x-import></div>
<div style="max-width:560px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:16px">
<div style="font-size:var(--text-h1);font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)">hobbies</div>
<div style="font-size:var(--text-body);line-height:var(--leading-normal);color:var(--text-secondary)">more to come here soon.</div>
</div>
</div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { route: "landing", slug: null };
  projectData = [
    { slug: "signal", title: "Signal — a calmer inbox", dates: "Feb 2025 — May 2025", body: "Signal strips email down to the messages that actually need a reply. I designed the triage model, the review queue, and the empty-state that made \"done\" feel real." },
    { slug: "fieldnotes", title: "Fieldnotes", dates: "Sep 2024 — Jan 2025", body: "A journaling tool for research teams. Focused on making raw notes searchable without asking anyone to tag them first." },
    { slug: "loop", title: "Loop scheduling", dates: "Mar 2024 — Jul 2024", body: "Rebuilt the scheduling core for a small ops team, cutting the average booking flow from six steps to two." }
  ];
  // Edit this list to update the experience screen.
  experienceData = [
    { role: "Product Designer", org: "Freelance", dates: "2025 — present", description: "Design and prototyping for a handful of early-stage teams, focused on small, well-made tools." },
    { role: "Product Designer", org: "Startup A", dates: "2023 — 2025", description: "Owned design for the core product from early prototype through first thousand users." },
    { role: "Design Intern", org: "Startup B", dates: "2022 — 2023", description: "Worked across web and native, shipping onboarding and settings surfaces." }
  ];
  go(route, slug) { this.setState({ route, slug: slug || null }); }
  renderVals() {
    const route = this.state.route;
    const current = this.projectData.find(p => p.slug === this.state.slug) || this.projectData[0];
    return {
      isLanding: route === "landing",
      isPortfolio: route === "portfolio",
      isProject: route === "project",
      isExperience: route === "experience",
      isHobbies: route === "hobbies",
      goLanding: () => this.go("landing"),
      goPortfolio: () => this.go("portfolio"),
      goExperience: () => this.go("experience"),
      goHobbies: () => this.go("hobbies"),
      projects: this.projectData.map(p => ({ title: p.title, select: () => this.go("project", p.slug) })),
      current,
      experience: this.experienceData
    };
  }
}

</script>
</body>
</html>
